<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Figurinhas 2026</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="topbar">
    <div class="header-center">
      <h1 id="title">Figurinhas 2026</h1>
      <div id="albumProgress" class="album-progress">0/0 • 0%</div>
    </div>

    <div class="header-actions" aria-label="Ferramentas">
      <div class="toggle-group">
        <span class="toggle-label">A–Z</span>
        <input id="sortAlphaToggle" class="hide-toggle" type="checkbox" />
      </div>
      <div class="toggle-group">
        <span class="toggle-label">Ocultar</span>
        <input id="hideOwnedToggle" class="hide-toggle" type="checkbox" />
      </div>
      <button id="exportBtn" class="export-btn" type="button">PDF</button>
    </div>
  </header>

  <main id="app"></main>

  <div id="toast" class="toast hidden"></div>

  <div id="exportModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
    <div class="modal-card">
      <h2 id="exportTitle">PDF</h2>
      <p>Escolha o que você quer colocar no PDF. Ele será gerado em ordem alfabética por time.</p>
      <div class="modal-actions">
        <button id="exportAllBtn" type="button">Exportar todas</button>
        <button id="exportMissingBtn" type="button">Exportar faltantes</button>
        <button id="exportCloseBtn" type="button">Fechar</button>
        <div class="json-actions">
          <button id="exportJsonBtn" type="button" class="subtle-btn">Exportar JSON</button>
          <button id="importJsonBtn" type="button" class="subtle-btn">Importar JSON</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
